
services:
  db:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hospital123
      MYSQL_DATABASE: hospital_management_system
    ports:
      - "3307:3306"
    volumes:
      - hospital_data:/var/lib/mysql

  app:
    build: .
    container_name: hospital-app
    depends_on:
      - db
    stdin_open: true
    tty: true
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: hospital123
      DB_NAME: hospital_management_system

volumes:
  hospital_data:
